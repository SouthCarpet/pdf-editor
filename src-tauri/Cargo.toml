[package]
name = "pdf-editor"
version = "1.1.0"
description = "Localhost-only PDF editor"
authors = ["You"]
license = "AGPL-3.0-or-later"
edition = "2021"
rust-version = "1.85"
# Plan 047: with two bin targets (this crate's `pdf-editor` from src/main.rs,
# `generate_bindings` auto-discovered from src/bin/generate_bindings.rs) and
# no default-run, tauri-bundler's `main_binary()` (settings.rs:1016-1022,
# tauri-cli-v2.11.1) could not tell which one is the app - found empirically
# via administrative-extract: it shipped generate_bindings.exe as the
# installed app. default-run is Cargo's own, standard disambiguation field.
default-run = "pdf-editor"

[lib]
name = "pdf_editor_lib"
# Restored full crate-type list after switching to MSVC toolchain.
# (mingw-w64 ld hit export-ordinal overflow >65535 with full Tauri+plugins;
# MSVC link.exe handles arbitrary export counts.)
crate-type = ["staticlib", "cdylib", "rlib"]

[lints.clippy]
cognitive_complexity = "deny"

[build-dependencies]
# Delta J: pin Tauri core to 2.11.x. tauri-build follows a separate release
# train (2.x where x = minor cadence) and is pinned to its highest 2.6.x.
tauri-build = { version = "2", features = [] }
cc = "=1.2.62"

[dependencies]
# Delta J: pin Tauri core to 2.11.x (verified-stable). Plugins follow their
# own release cadence and are compatible with tauri 2.11 at 2.x.
tauri = { version = "=2.11", features = [] }
# Cargo.lock is not committed, so the resolver takes the newest crates that tauri 2.11
# accepts. The tauri 2.12 train (tauri-runtime, tauri-runtime-wry, tauri-macros,
# tauri-build, tauri-utils 2.10) loosely matches tauri 2.11 but breaks its build
# (E0308 in shared_app_impl, missing UnexpectedMenuKind). tauri-utils 2.10 is the
# anchor of that train: pinning tauri-utils to the 2.11 train makes cargo pick the
# matching 2.11 versions of all the others. Remove this line when tauri moves to 2.12.
tauri-utils = { version = "=2.9.3", default-features = false }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-opener = "=2.5.4"
tauri-plugin-shell = "2"
tauri-plugin-single-instance = "=2.4.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "process", "sync", "time", "io-util"] }
tokio-util = { version = "0.7", features = ["rt"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-appender = "0.2"
directories = "5"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "macros", "migrate", "chrono"] }
chrono = { version = "0.4", features = ["serde"] }
lopdf = "0.44"
# mupdf = "0.4"  # deferred — mupdf-sys 0.4.4 generates VS2019 (v142) solution which requires installing VS 2019 BuildTools alongside our VS 2026 (v143). Use mutool sidecar (Phase 4 MupdfWrapper) at runtime per engine_pdf_rust_core spec.
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "tiff", "bmp"] }
imageproc = "0.25"
# Delta U: system font enumeration + TTF parsing. font-kit uses DirectWrite on
# Windows (no native build deps); ttf-parser is pure-Rust no-std.
font-kit = "0.14"
ttf-parser = "0.24"
similar = "2"
# tesseract = "0.15"  # deferred — leptonica-sys requires vcpkg with leptonica installed (VCPKG_ROOT). Always use Tesseract sidecar at runtime per engine_ocr_stack "Always use sidecar" fallback.
aes = "0.8"
cbc = "0.1"
sha2 = "0.10"
rayon = "1.10"
num_cpus = "1"
specta = { version = "=2.0.0-rc.25", features = ["derive", "chrono", "serde_json"] }
specta-typescript = "=0.0.12"
tauri-specta = { version = "=2.0.0-rc.25", features = ["derive", "typescript"] }
# Phase 9 Task 53 Optimize tool: pipelines intermediate PDFs through a
# scoped tempdir before the final copy to `output`.
tempfile = "3"
# Phase 14 Task 73 — Delta Y preservation flag set for pipeline nodes.
bitflags = "2"
# Phase 14 Task 77 — pipeline_run_on_folder_cmd uses walkdir to discover
# PDFs in a chosen folder.
walkdir = "2"
# Plan 119: the opt-in GitHub release check (services/release_check.rs, the
# only module allowed to use it; scripts/test-privacy.ps1 enforces that).
# No default features: rustls only, no system proxy, no HTTP/2.
reqwest = { version = "0.13.4", default-features = false, features = ["rustls"] }

# Delta P: SetUnhandledExceptionFilter for the Windows SEH crash logger
# (segfault / access violation / stack overflow). Only used on target_os=windows
# but the dep is unconditional because cargo features can't be cfg-gated
# without `[target.'cfg(...)'.dependencies]` — keeping it flat for simplicity.
[target.'cfg(windows)'.dependencies]
# `Win32_System_Kernel` is required by the windows-0.59 build for
# `SetUnhandledExceptionFilter`, `EXCEPTION_POINTERS`, and
# `LPTOP_LEVEL_EXCEPTION_FILTER` to be gated in (the previous skeleton missed
# this).  `EXCEPTION_CONTINUE_SEARCH` lives in `System::Diagnostics::Debug`
# as a plain `i32` constant, not in `Foundation`.
# `Win32_System_Registry` (plan 119): read-only registry lookup in
# `util/install_detect.rs` that finds the old MSI and the Inno setup install.
# `Win32_Storage_FileSystem` (plan 119): folder and file handles in
# `util/pinned_dir.rs` for the uninstall cleanup and the update download.
windows = { version = "0.59", features = ["Win32_System_Diagnostics_Debug", "Win32_System_Kernel", "Win32_Foundation", "Win32_System_Registry", "Win32_Storage_FileSystem"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
# Phase 18 Task 90d — opt-in flag for tests that require real sidecar
# binaries + generated fixtures (qpdf, ghostscript, mutool, soffice,
# tesseract, pdfcrack). CI runs the `sidecar-contract` job with this
# feature on after `scripts/fetch-sidecars.ps1` + `stage-sidecars.ps1`
# + `generate-fixtures.ps1`. Devs can opt-in locally the same way.
sidecar-tests = []
# Plan 067 W2 — opt-in flag for tests that need a real LibreOffice install.
# Deliberately NOT part of `sidecar-tests`: LibreOffice is not in
# `scripts/sidecar-manifest.json`, `scripts/fetch-sidecars.ps1` never
# downloads it and `scripts/stage-sidecars.ps1` says so in as many words
# (lines 26 and 57). It ships as a bundled resource tree through
# `tauri.conf.json`, not as an externalBin sidecar, so "the sidecars are
# staged" and "LibreOffice is installed" are two different preconditions and
# need two different switches.
libreoffice-tests = []

[dev-dependencies]
tempfile = "3"
# Phase 17 Task 85 — performance benchmarks.
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }
rand = "0.8"
# Phase 18 Task 90b — property-based tests for the pdf_editor service.
proptest = "1"

[[bench]]
name = "pdf_ops"
harness = false

# Local update builds were taking 5+ minutes. Cargo disables incremental
# compilation for release by default, so `update-pdf-editor.bat` recompiled
# and re-codegen'd the whole binary every time even when one file changed.
# This app is built and run locally, never distributed, so trading a little
# runtime optimisation for a much shorter edit-to-running-app loop is the
# right way round. The heavy lifting is done by the sidecars and lopdf, both
# of which are dependencies and stay fully optimised either way.
#
# Not addressed here, and the bigger cost: D: is exFAT, which has no hard
# links, so cargo copies files where it would normally link them. target/debug
# is 79.7 GB across 52224 files with 24 GB of that in the incremental cache.
# Moving the target directory to NTFS is the real fix, and it is a user
# decision because it interacts with an unresolved CARGO_TARGET_DIR question.
#
# 2026-08-02: `incremental = true` was the wrong tool for that goal and it was
# actively harmful here. It caused a hard rustc crash, not a compile error:
#
#   error: could not compile `pdf-editor` (lib)
#   process didn't exit successfully: rustc.exe --crate-name pdf_editor_lib ...
#   (exit code: 0xc0000005, STATUS_ACCESS_VIOLATION)
#
# rustc deserialises the incremental dep-graph (200 MB here) on every build, and
# a corrupt cache makes it segfault rather than fail cleanly. On this machine
# that is the expected outcome rather than bad luck: the volume is exFAT with a
# dirty-bit history and the host has a standing memory-corruption suspicion.
#
# It also did not deliver the speed it was added for. An update build changes
# this crate, so the expensive final codegen has to happen anyway, and the
# incremental bookkeeping adds 200 MB of read/write on a filesystem that copies
# where others hard-link. The user reported 710/713 onwards still being slow.
#
# What the comment above actually wants is a per-package opt-level split, which
# is the standard way to get a fast edit-to-running-app loop without giving up
# dependency optimisation:
#   - our own crates compile at opt-level 1, which is where the slow last three
#     units were coming from
#   - every dependency stays at opt-level 3 and is built once, so lopdf, image
#     and rayon keep the optimisation the rationale above depends on
[profile.release]
incremental = false
opt-level = 1

[profile.release.package."*"]
opt-level = 3
