[package]
name = "pdf-editor"
version = "0.1.0"
description = "Localhost-only PDF editor"
authors = ["You"]
license = "AGPL-3.0"
edition = "2021"
rust-version = "1.85"

[lib]
name = "pdf_editor_lib"
# Restored full crate-type list after switching to MSVC toolchain.
# (mingw-w64 ld hit export-ordinal overflow >65535 with full Tauri+plugins;
# MSVC link.exe handles arbitrary export counts.)
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
# Delta J: pin Tauri core to 2.11.x. tauri-build follows a separate release
# train (2.x where x = minor cadence) and is pinned to its highest 2.6.x.
tauri-build = { version = "2", features = [] }

[dependencies]
# Delta J: pin Tauri core to 2.11.x (verified-stable). Plugins follow their
# own release cadence and are compatible with tauri 2.11 at 2.x.
tauri = { version = "=2.11", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "process", "sync", "time", "io-util"] }
tokio-util = { version = "0.7", features = ["rt"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-appender = "0.2"
directories = "5"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "macros", "migrate", "chrono"] }
chrono = { version = "0.4", features = ["serde"] }
lopdf = "0.34"
# mupdf = "0.4"  # deferred — mupdf-sys 0.4.4 generates VS2019 (v142) solution which requires installing VS 2019 BuildTools alongside our VS 2026 (v143). Use mutool sidecar (Phase 4 MupdfWrapper) at runtime per engine_pdf_rust_core spec.
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "tiff", "bmp"] }
imageproc = "0.25"
similar = "2"
# tesseract = "0.15"  # deferred — leptonica-sys requires vcpkg with leptonica installed (VCPKG_ROOT). Always use Tesseract sidecar at runtime per engine_ocr_stack "Always use sidecar" fallback.
aes = "0.8"
cbc = "0.1"
sha2 = "0.10"
rayon = "1.10"
num_cpus = "1"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[dev-dependencies]
tempfile = "3"

