[graph]
all-features = false
no-default-features = false

[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "warn"
# Vulnerabilities still fail (default in modern cargo-deny). Unmaintained
# advisories are downgraded to warn — most come from gtk-rs Linux deps that
# we never actually run (Windows-only target).
unmaintained = "workspace"  # warn on unmaintained crates we actually depend on (not just transitively)
# Exceptions owned by ANIMUS plan 033_lopdf-advisory.
#
# NOT TIME-BOXED, AND THAT IS A LIMITATION OF THE TOOL, NOT A CHOICE. An
# earlier version of this block claimed to be time-boxed and referred to
# "advisory dates below" that did not exist. cargo-deny 0.19.5 accepts only
# `id` and `reason` in an ignore entry and rejects anything else with
# `error[unexpected-keys]`, so no expiry can be expressed here. These
# suppressions last until a human deletes them. Plan 033's upgrade phase
# owns that deletion, and nothing else will remind anyone.
ignore = [
    # RUSTSEC-2026-0187 IS NO LONGER IGNORED HERE, and deleting the entry was
    # the point rather than housekeeping.
    #
    # The advisory is closed by the 0.34 -> 0.44 upgrade, proven behaviourally
    # (deep_nesting_no_longer_aborts drives lopdf and goes red if the pin falls
    # below 0.42). But the suppression survived that upgrade by one commit, and
    # a verifier caught what that costs: while it stood, cargo-deny was
    # explicitly blindfolded to this exact advisory, so a pin regression below
    # 0.42 would have left ONE gate standing instead of two. The old rationale
    # ("lopdf 0.34 pinned ... accepted risk pending the upgrade") had also
    # become false the moment the upgrade landed, and a stale reason string is
    # worse than none: it reads as a current judgement.
    # ttf-parser declared unmaintained. Transitive (font stack), no
    # vulnerability, replacement decision belongs to the same plan.
    { id = "RUSTSEC-2026-0192", reason = "unmaintained, not vulnerable; replacement decision tracked in plan 033" },
]

[licenses]
# cargo-deny 0.16+ removed the `unlicensed`, `deny`, `copyleft`, `default`
# keys (PR #611): unknown/copyleft licenses are now implicitly denied unless
# explicitly allowed below. The `allow` list is the single source of truth.
# `NCSA` added 2026-05-15 because libfuzzer-sys ships under "(MIT OR Apache-2.0) AND NCSA"
# (cargo-fuzz harness in src-tauri/fuzz/, gated by feature in CI nightly).
allow = ["MIT", "MIT-0", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause", "CC0-1.0", "ISC", "Unicode-DFS-2016", "Unicode-3.0", "Zlib", "MPL-2.0", "AGPL-3.0", "AGPL-3.0-only", "AGPL-3.0-or-later", "NCSA"]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
