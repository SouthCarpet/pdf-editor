name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  msi-build:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.0.3
      - uses: actions/setup-node@v7
        with:
          node-version: 22.13
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable-x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Cache sidecars
        uses: actions/cache@v6
        with:
          path: src-tauri/sidecars
          key: sidecars-${{ hashFiles('scripts/sidecar-manifest.json') }}
      - shell: pwsh
        run: pwsh scripts/fetch-sidecars.ps1
      - shell: pwsh
        run: pwsh scripts/stage-sidecars.ps1
      - run: pnpm install --frozen-lockfile
      # frontend build first so dist/ exists for tauri::generate_context!() in
      # main.rs (the generate_bindings binary still depends on the lib which
      # transitively pulls the tauri-build script).
      - run: pnpm build
      - run: pnpm gen:bindings
      - run: pnpm tauri build
      - uses: actions/upload-artifact@v7
        with:
          name: msi-bundle
          path: src-tauri/target/release/bundle/msi/*.msi

  msi-install-smoke:
    needs: [msi-build]
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: msi-bundle
          path: src-tauri/target/release/bundle/msi/
      - name: Run install smoke (requires Sandbox-enabled runner)
        shell: pwsh
        run: pwsh scripts/test-msi-install.ps1
