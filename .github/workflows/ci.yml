name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with:
          version: 11.0.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm tsc --noEmit
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable-x86_64-pc-windows-msvc
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      # cargo clippy needs dist/ for tauri::generate_context!()
      - run: pnpm build
      # tauri-build validates that every bundle.externalBin path and every
      # bundle.resources glob resolves at compile time. Both sets contain
      # gitignored entries, so we create zero-byte stubs.
      - name: Create sidecar and bundle-resource stubs
        shell: pwsh
        run: |
          New-Item -Path src-tauri/sidecars -ItemType Directory -Force | Out-Null
          foreach ($n in @("qpdf","gswin64c","mutool","tesseract","pdfcrack")) {
            New-Item -Path "src-tauri/sidecars/$n-x86_64-pc-windows-msvc.exe" -ItemType File -Force | Out-Null
          }
          # tauri-build resolves every bundle.resources glob too, and fails the
          # build when one matches nothing. resources/tessdata/ is gitignored
          # (58 MB of OCR models), so on a fresh checkout that glob was empty
          # and all four Rust jobs died inside the build script with a message
          # that named neither the config key nor the workflow gap.
          # resources/ocr/* is tracked in git, so only tessdata needs a stub.
          # Guarded instead of -Force: New-Item -Force truncates an existing
          # file, and a restored cache could hold a real model.
          New-Item -Path src-tauri/resources/tessdata -ItemType Directory -Force | Out-Null
          if (-not (Get-ChildItem -Path src-tauri/resources/tessdata -Filter *.traineddata)) {
            New-Item -Path src-tauri/resources/tessdata/eng.traineddata -ItemType File | Out-Null
          }
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml -- -D warnings

  cargo-deny:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      # Cargo.lock is gitignored; generate it for the audit
      - run: cargo generate-lockfile --manifest-path src-tauri/Cargo.toml
      # The EmbarkStudios/cargo-deny-action@v2 is Docker-based (Linux-only).
      # We're on windows-latest so we install via cargo and run directly.
      - name: Install cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - run: cargo deny --manifest-path src-tauri/Cargo.toml check

  rust-unit:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with:
          version: 11.0.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      # tauri::generate_context!() reads dist/ from tauri.conf.json. Build the
      # frontend first so the macro doesn't fail at compile time.
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # tauri-build validates bundle.externalBin paths and bundle.resources
      # globs at compile time.
      - name: Create sidecar and bundle-resource stubs
        shell: pwsh
        run: |
          New-Item -Path src-tauri/sidecars -ItemType Directory -Force | Out-Null
          foreach ($n in @("qpdf","gswin64c","mutool","tesseract","pdfcrack")) {
            New-Item -Path "src-tauri/sidecars/$n-x86_64-pc-windows-msvc.exe" -ItemType File -Force | Out-Null
          }
          # tauri-build resolves every bundle.resources glob too, and fails the
          # build when one matches nothing. resources/tessdata/ is gitignored
          # (58 MB of OCR models), so on a fresh checkout that glob was empty
          # and all four Rust jobs died inside the build script with a message
          # that named neither the config key nor the workflow gap.
          # resources/ocr/* is tracked in git, so only tessdata needs a stub.
          # Guarded instead of -Force: New-Item -Force truncates an existing
          # file, and a restored cache could hold a real model.
          New-Item -Path src-tauri/resources/tessdata -ItemType Directory -Force | Out-Null
          if (-not (Get-ChildItem -Path src-tauri/resources/tessdata -Filter *.traineddata)) {
            New-Item -Path src-tauri/resources/tessdata/eng.traineddata -ItemType File | Out-Null
          }
      - run: cargo test --manifest-path src-tauri/Cargo.toml

  rust-property:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with:
          version: 11.0.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Create sidecar and bundle-resource stubs
        shell: pwsh
        run: |
          New-Item -Path src-tauri/sidecars -ItemType Directory -Force | Out-Null
          foreach ($n in @("qpdf","gswin64c","mutool","tesseract","pdfcrack")) {
            New-Item -Path "src-tauri/sidecars/$n-x86_64-pc-windows-msvc.exe" -ItemType File -Force | Out-Null
          }
          # tauri-build resolves every bundle.resources glob too, and fails the
          # build when one matches nothing. resources/tessdata/ is gitignored
          # (58 MB of OCR models), so on a fresh checkout that glob was empty
          # and all four Rust jobs died inside the build script with a message
          # that named neither the config key nor the workflow gap.
          # resources/ocr/* is tracked in git, so only tessdata needs a stub.
          # Guarded instead of -Force: New-Item -Force truncates an existing
          # file, and a restored cache could hold a real model.
          New-Item -Path src-tauri/resources/tessdata -ItemType Directory -Force | Out-Null
          if (-not (Get-ChildItem -Path src-tauri/resources/tessdata -Filter *.traineddata)) {
            New-Item -Path src-tauri/resources/tessdata/eng.traineddata -ItemType File | Out-Null
          }
      - run: cargo test --manifest-path src-tauri/Cargo.toml --test proptest_pdf_editor

  frontend-unit:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with:
          version: 11.0.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  bindings-drift:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with:
          version: 11.0.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Create sidecar and bundle-resource stubs
        shell: pwsh
        run: |
          New-Item -Path src-tauri/sidecars -ItemType Directory -Force | Out-Null
          foreach ($n in @("qpdf","gswin64c","mutool","tesseract","pdfcrack")) {
            New-Item -Path "src-tauri/sidecars/$n-x86_64-pc-windows-msvc.exe" -ItemType File -Force | Out-Null
          }
          # tauri-build resolves every bundle.resources glob too, and fails the
          # build when one matches nothing. resources/tessdata/ is gitignored
          # (58 MB of OCR models), so on a fresh checkout that glob was empty
          # and all four Rust jobs died inside the build script with a message
          # that named neither the config key nor the workflow gap.
          # resources/ocr/* is tracked in git, so only tessdata needs a stub.
          # Guarded instead of -Force: New-Item -Force truncates an existing
          # file, and a restored cache could hold a real model.
          New-Item -Path src-tauri/resources/tessdata -ItemType Directory -Force | Out-Null
          if (-not (Get-ChildItem -Path src-tauri/resources/tessdata -Filter *.traineddata)) {
            New-Item -Path src-tauri/resources/tessdata/eng.traineddata -ItemType File | Out-Null
          }
      - run: pnpm gen:bindings
      - name: Verify bindings.ts in sync
        shell: pwsh
        run: |
          git diff --exit-code src/bindings.ts
          if ($LASTEXITCODE -ne 0) {
            Write-Error "::error::bindings.ts drift detected; run pnpm gen:bindings locally and commit"
            exit 1
          }

  localization:
    runs-on: windows-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13
      - run: node scripts/check-i18n.mjs

  sidecar-contract:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with:
          version: 11.0.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Cache sidecars
        uses: actions/cache@v4
        with:
          path: src-tauri/sidecars
          key: sidecars-${{ hashFiles('scripts/sidecar-manifest.json') }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - shell: pwsh
        run: pwsh scripts/fetch-sidecars.ps1
      - shell: pwsh
        run: pwsh scripts/stage-sidecars.ps1
      - shell: pwsh
        run: pwsh scripts/generate-fixtures.ps1
      - run: cargo test --manifest-path src-tauri/Cargo.toml --features sidecar-tests -- --include-ignored

  privacy:
    runs-on: windows-latest
    # test-privacy.ps1 now scans src-tauri/Cargo.toml direct deps. No
    # release build, no MSVC tools, no Cargo.lock required. Seconds.
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - shell: pwsh
        run: pwsh scripts/test-privacy.ps1

  a11y:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with:
          version: 11.0.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm vitest run a11y

  frontend-e2e:
    runs-on: windows-latest
    timeout-minutes: 40
    needs: [sidecar-contract]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with:
          version: 11.0.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: src-tauri/sidecars
          key: sidecars-${{ hashFiles('scripts/sidecar-manifest.json') }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps
      # Same bundle.resources requirement as every other Rust-compiling job:
      # tessdata is gitignored, and this job restores sidecars from cache but
      # nothing populates resources/tessdata. This job had NEVER run before
      # 2026-08-02 (its `needs: sidecar-contract` gate had never passed), so
      # this was the fifth instance of the gitignored-artifact class, exposed
      # only when the fourth was fixed. Guarded, not -Force: a future cache
      # step could hold a real model, and New-Item -Force truncates.
      - name: Create bundle-resource stubs
        shell: pwsh
        run: |
          New-Item -Path src-tauri/resources/tessdata -ItemType Directory -Force | Out-Null
          if (-not (Get-ChildItem -Path src-tauri/resources/tessdata -Filter *.traineddata)) {
            New-Item -Path src-tauri/resources/tessdata/eng.traineddata -ItemType File | Out-Null
          }
      # `--no-bundle` skips WiX/MSI; Playwright tests the .exe directly,
      # so we don't need the installer artifact. Avoids opaque candle.exe
      # failures (Tauri-cli swallows WiX stderr).
      - run: pnpm tauri build --debug --no-bundle
      - run: pnpm exec playwright test
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: tests/e2e/test-results
